<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="46%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#f7f7fa"/>
      <stop offset="100%" stop-color="#d8d8e2"/>
    </radialGradient>
    <linearGradient id="base" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#28282e"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="tophl" x1="130" y1="0" x2="382" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="256" cy="220" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="lTL" x1="256" y1="220" x2="96"  y2="96"  gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lTR" x1="256" y1="220" x2="416" y2="96"  gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lBL" x1="256" y1="220" x2="96"  y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lBR" x1="256" y1="220" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lL" x1="256" y1="220" x2="96"  y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lR" x1="256" y1="220" x2="416" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lT" x1="256" y1="220" x2="256" y2="96"  gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lB" x1="256" y1="220" x2="256" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bezel" x1="200" y1="164" x2="312" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e4d4ff"/>
      <stop offset="35%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="iRing" x1="220" y1="186" x2="292" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glass" cx="248" cy="212" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a0840"/>
      <stop offset="60%"  stop-color="#0d0612"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    <radialGradient id="cglow" cx="256" cy="220" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="96" y="96" width="320" height="320" rx="58"/>
    </clipPath>
    <filter id="shadow" x="-28%" y="-28%" width="156%" height="156%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#08080f" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="5"  stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="1"  stdDeviation="3"  flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Icon -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="58" fill="url(#base)"/>

    <g clip-path="url(#clip)">
      <!-- Room facets -->
      <polygon points="96,96  256,220 96,416"  fill="#1e1e27" opacity="0.95"/>
      <polygon points="416,96 256,220 416,416" fill="#15151b" opacity="0.95"/>
      <polygon points="96,96  416,96  256,220" fill="#23232c" opacity="0.95"/>
      <polygon points="96,416 416,416 256,220" fill="#101013" opacity="0.95"/>

      <!-- VP bloom -->
      <circle cx="256" cy="220" r="108" fill="url(#bloom)"/>

      <!-- Perspective rays (8 directions) -->
      <line x1="256" y1="220" x2="96"  y2="96"  stroke="url(#lTL)" stroke-width="1.1"/>
      <line x1="256" y1="220" x2="416" y2="96"  stroke="url(#lTR)" stroke-width="1.1"/>
      <line x1="256" y1="220" x2="96"  y2="416" stroke="url(#lBL)" stroke-width="1.1"/>
      <line x1="256" y1="220" x2="416" y2="416" stroke="url(#lBR)" stroke-width="1.1"/>
      <line x1="256" y1="220" x2="96"  y2="220" stroke="url(#lL)"  stroke-width="0.85"/>
      <line x1="256" y1="220" x2="416" y2="220" stroke="url(#lR)"  stroke-width="0.85"/>
      <line x1="256" y1="220" x2="256" y2="96"  stroke="url(#lT)"  stroke-width="0.85"/>
      <line x1="256" y1="220" x2="256" y2="416" stroke="url(#lB)"  stroke-width="0.85"/>

      <!-- Camera aperture -->
      <circle cx="256" cy="220" r="70"  fill="none" stroke="#8b5cf6" stroke-width="22" stroke-opacity="0.055"/>
      <circle cx="256" cy="220" r="57"  fill="#0c0c12" fill-opacity="0.88" stroke="url(#bezel)" stroke-width="2.8"/>
      <circle cx="256" cy="220" r="46"  fill="none" stroke="url(#iRing)" stroke-width="1.3"/>
      <polygon points="273.5,185.7 291,220 273.5,254.3 238.5,254.3 221,220 238.5,185.7"
               fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" stroke-linejoin="round"/>
      <circle cx="256" cy="220" r="29"  fill="url(#glass)"/>
      <circle cx="256" cy="220" r="29"  fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="256" cy="220" r="16"  fill="url(#cglow)"/>
      <circle cx="256" cy="220" r="3.2" fill="#9333ea" opacity="0.7"/>
      <circle cx="246" cy="210" r="4.2" fill="white"   opacity="0.38"/>
      <circle cx="249.5" cy="206" r="1.8" fill="white" opacity="0.22"/>
    </g>

    <!-- Edge highlight -->
    <rect x="96" y="96" width="320" height="320" rx="58"
          fill="none" stroke="white" stroke-width="1" stroke-opacity="0.07"/>
    <path d="M 158 97.5 Q 256 93.5 354 97.5"
          stroke="url(#tophl)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
